name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      LIVE_ENABLED: "false"
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements.lock
      - run: pytest -q tests
      - name: drills
        env: {CREW_APPROVAL_HMAC_KEY: ci-only-not-secret}
        run: python scripts/run_drills.py
      - run: python scripts/run_paper_day.py > /dev/null
